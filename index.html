<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ECC Toy Curve Visualizer - Ethereum Style</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { color: #38bdf8; font-size: 24px; margin-top: 0; }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #94a3b8; }
        input {
            width: 100%;
            padding: 8px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            grid-column: 1 / -1;
        }
        button:hover { background: #0369a1; }
        .output-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        canvas {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 8px 12px;
            border: 1px solid #334155;
            text-align: center;
            font-size: 14px;
        }
        th { background: #334155; color: #38bdf8; }
        .highlight { background: #0369a1; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>HMWK 1: ECC Scalar Multiplication (secp256k1 Toy Model)</h1>
    <p style="color: #94a3b8; font-size: 14px;">Curva: $y^2 \equiv x^3 + 7 \pmod{17}$ | Base $G=(1,5)$</p>
    
    <div class="controls">
        <div>
            <label for="privateKey">Chiave Privata (k):</label>
            <input type="number" id="privateKey" value="6" min="1" max="30">
        </div>
        <button onclick="runSimulation()">Esegui Moltiplicazione Scalare</button>
    </div>

    <div class="output-section">
        <div style="flex: 1; min-width: 280px;">
            <h3 style="margin-top:0;">Visualizzazione Grafica (Canvas)</h3>
            <canvas id="canvas" width="300" height="300"></canvas>
        </div>
        <div style="flex: 1.5; min-width: 300px;">
            <h3 style="margin-top:0;">Tabella Passaggi (iG)</h3>
            <div style="max-height: 280px; overflow-y: auto;">
                <table id="resultTable">
                    <thead>
                        <tr><th>Step (i)</th><th>Punto (x, y)</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const p = 17;
const a = 0;
const b = 7;

function mod(n, m) {
    return ((n % m) + m) % m;
}

function modInverse(a, m) {
    a = mod(a, m);
    for (let x = 1; x < m; x++) {
        if (mod(a * x, m) === 1) return x;
    }
    return 1;
}

function pointAdd(P, Q) {
    if (!P) return Q;
    if (!Q) return P;
    
    let x1 = P[0], y1 = P[1];
    let x2 = Q[0], y2 = Q[1];
    
    if (x1 === x2 && mod(y1 + y2, p) === 0) return null; // Punto all'infinito
    
    let s;
    if (x1 === x2 && y1 === y2) {
        if (y1 === 0) return null;
        let num = mod(3 * x1 * x1 + a, p);
        let den = modInverse(2 * y1, p);
        s = mod(num * den, p);
    } else {
        let num = mod(y2 - y1, p);
        let den = modInverse(x2 - x1, p);
        s = mod(num * den, p);
    }
    
    let x3 = mod(s * s - x1 - x2, p);
    let y3 = mod(s * (x1 - x3) - y1, p);
    return [x3, y3];
}

function scalarMultiply(k, G) {
    let result = null;
    let addend = G;
    let steps = [];
    
    for (let i = 1; i <= k; i++) {
        result = pointAdd(result, G);
        steps.push({i: i, point: result ? [...result] : "Infinito"});
    }
    return steps;
}

function drawGrid(activePoint) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const size = canvas.width;
    const stepSize = size / p;
    
    ctx.clearRect(0, 0, size, size);
    
    // Disegna griglia
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= p; i++) {
        ctx.beginPath();
        ctx.moveTo(i * stepSize, 0);
        ctx.lineTo(i * stepSize, size);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * stepSize);
        ctx.lineTo(size, i * stepSize);
        ctx.stroke();
    }
    
    // Trova tutti i punti validi della curva e disegnali in grigio chiaro
    ctx.fillStyle = '#64748b';
    for (let x = 0; x < p; x++) {
        for (let y = 0; y < p; y++) {
            let lhs = mod(y * y, p);
            let rhs = mod(x*x*x + a*x + b, p);
            if (lhs === rhs) {
                ctx.beginPath();
                ctx.arc(x * stepSize + stepSize/2, (p - 1 - y) * stepSize + stepSize/2, 4, 0, 2 * Math.PI);
                ctx.fill();
            }
        }
    }
    
    // Evidenzia il punto attivo (chiave pubblica finale)
    if (activePoint && activePoint !== "Infinito") {
        let [ax, ay] = activePoint;
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(ax * stepSize + stepSize/2, (p - 1 - ay) * stepSize + stepSize/2, 7, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

function runSimulation() {
    let k = parseInt(document.getElementById('privateKey').value);
    let G = [1, 5];
    let steps = scalarMultiply(k, G);
    
    let tbody = document.querySelector('#resultTable tbody');
    tbody.innerHTML = '';
    
    let finalPoint = null;
    steps.forEach(step => {
        let row = document.createElement('tr');
        if (step.i === k) row.classList.add('highlight');
        
        let pStr = Array.isArray(step.point) ? `(${step.point[0]}, ${step.point[1]})` : step.point;
        row.innerHTML = `<td>${step.i}G</td><td>${pStr}</td>`;
        tbody.appendChild(row);
        finalPoint = step.point;
    });
    
    drawGrid(finalPoint);
}

// Esegui all'avvio
runSimulation();
</script>

</body>
</html>
